databases:
  - name: futbol-stats-db
    databaseName: futbol_db
    user: futbol_user

services:
  - type: web
    name: futbol-stats-api
    runtime: node
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: futbol-stats-db
          property: connectionString
