services:
  - type: web
    name: futbol-stats-api
    runtime: node
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PG_CA_CERT
        sync: false
